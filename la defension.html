
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Defensión — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#050505;
    color:#f2eee7;
    font-family:Georgia, "Times New Roman", serif;
    overflow:hidden;
}


/* ESCENARIO */

.escenario{
    position:relative;
    width:100%;
    height:100vh;
    background:#050505;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* MARCO */

.marco{
    position:relative;

    width:92vw;
    max-width:1500px;

    height:74vh;

    overflow:hidden;

    background:#000;
}


/* FOTOGRAFIAS */

.foto{
    position:absolute;
    inset:0;

    opacity:0;

    transition:opacity 2.8s ease-in-out;
}

.foto.activa{
    opacity:1;
}

.foto img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* OSCURECIMIENTO */

.oscuro{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.30),
            rgba(0,0,0,.03) 45%,
            rgba(0,0,0,.45)
        );

    pointer-events:none;
}


/* TITULO */

.titulo{
    position:absolute;

    top:6vh;
    left:0;

    width:100%;

    text-align:center;

    z-index:10;

    text-shadow:0 2px 12px rgba(0,0,0,.9);
}

.titulo h1{
    margin:0;

    font-size:clamp(32px,4vw,58px);

    font-weight:normal;

    letter-spacing:7px;
}

.titulo p{
    margin:10px 0 0;

    color:#c9a35b;

    font-size:clamp(12px,1.2vw,18px);

    letter-spacing:4px;
}


/* TEXTO INFERIOR */

.frase{
    position:absolute;

    bottom:7vh;

    width:100%;

    text-align:center;

    z-index:10;

    font-size:clamp(13px,1.3vw,19px);

    letter-spacing:2px;

    color:#eee8df;

    text-shadow:0 2px 10px #000;
}


/* BOTON MUSICA */

.musica{
    position:fixed;

    right:28px;
    bottom:28px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:rgba(0,0,0,.80);

    color:#c9a35b;

    font-size:22px;

    cursor:pointer;

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;
}

.musica:hover{
    background:#c9a35b;
    color:#050505;
}


/* VOLVER */

.volver{
    position:fixed;

    left:28px;
    bottom:30px;

    z-index:30;

    color:#ddd;

    text-decoration:none;

    font-size:14px;

    letter-spacing:2px;

    text-shadow:0 2px 8px #000;
}

.volver:hover{
    color:#c9a35b;
}


/* YOUTUBE OCULTO */

.youtube{
    position:fixed;

    width:1px;
    height:1px;

    left:-100px;
    top:-100px;

    opacity:0;

    pointer-events:none;
}


/* MOVIL */

@media(max-width:700px){

    .marco{
        width:96vw;
        height:65vh;
    }

    .titulo{
        top:4vh;
    }

    .titulo h1{
        letter-spacing:4px;
    }

    .titulo p{
        letter-spacing:2px;
    }

    .frase{
        bottom:8vh;
        padding:0 20px;
    }

    .volver{
        left:15px;
        bottom:18px;
    }

    .musica{
        right:15px;
        bottom:15px;
    }

}

</style>

</head>


<body>


<div class="escenario">


    <div class="marco">


        <!-- FOTO 1 -->

        <div class="foto activa">

            <img src="https://masjerez.com/storage/noticias/March2022/929CjWGLj3LerlwEKRfd.png">

        </div>


        <!-- FOTO 2 -->

        <div class="foto">

            <img src="https://static.grupojoly.com/clip/79b033cc-1ebb-409b-be77-0dde7c045131_16-9-aspect-ratio_1600w_0.webp">

        </div>


        <!-- FOTO 3 -->

        <div class="foto">

            <img src="https://www.defension.com/wp-content/uploads/2015/01/slideshow02.jpg">

        </div>


        <!-- FOTO 4 -->

        <div class="foto">

            <img src="https://static.grupojoly.com/clip/20436ea8-be2b-4cda-b470-88c5df859da7_16-9-aspect-ratio_1600w_0.webp">

        </div>


        <!-- FOTO 5 -->

        <div class="foto">

            <img src="https://static.grupojoly.com/clip/506d3ec0-87f0-4c05-be5e-08df5161c392_16-9-aspect-ratio_1600w_0_x1368y747.webp">

        </div>


        <!-- FOTO 6 -->

        <div class="foto">

        </div>


    </div>


    <div class="oscuro"></div>


    <div class="titulo">

        <h1>LA DEFENSIÓN</h1>

        <p>JEREZ DE LA FRONTERA · SEMANA SANTA</p>

    </div>


    <div class="frase">

        Santísimo Cristo de la Defensión · María Santísima de la O

    </div>


</div>


<!-- BOTON MUSICA -->

<button class="musica" id="botonMusica">♪</button>


<!-- MUSICA OCULTA -->

<iframe

    id="youtube"

    class="youtube"

    src="https://www.youtube.com/embed/YveQMxcQvPg?enablejsapi=1&playsinline=1&controls=0"

    allow="autoplay">

</iframe>


<!-- VOLVER -->

<a href="hermandades.html" class="volver">

    ← HERMANDADES

</a>


<script>


/* CAMBIO DE FOTOGRAFIAS */

const fotos = document.querySelectorAll(".foto");

let actual = 0;


setInterval(function(){

    fotos[actual].classList.remove("activa");

    actual++;

    if(actual >= fotos.length){

        actual = 0;

    }

    fotos[actual].classList.add("activa");

},7000);



/* MUSICA */

const boton = document.getElementById("botonMusica");

const youtube = document.getElementById("youtube");

let sonando = false;


boton.addEventListener("click",function(){

    if(!sonando){

        youtube.contentWindow.postMessage(

            '{"event":"command","func":"playVideo","args":""}',

            "*"

        );

        boton.textContent="Ⅱ";

        sonando=true;

    }

    else{

        youtube.contentWindow.postMessage(

            '{"event":"command","func":"pauseVideo","args":""}',

            "*"

        );

        boton.textContent="♪";

        sonando=false;

    }

});


</script>


</body>

</html>
