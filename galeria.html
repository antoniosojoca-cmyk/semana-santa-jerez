<title>Galería — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#080808;
    color:#f2eee7;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    min-height:100vh;
}


/* CABECERA */

header{
    text-align:center;
    padding:45px 20px 30px;
}

header h1{
    margin:0;
    font-size:42px;
    letter-spacing:5px;
    font-weight:normal;
}

header p{
    margin:14px 0 0;
    color:#c9a35b;
    font-size:18px;
    letter-spacing:2px;
}


/* SALAS */

.salas{
    width:94%;
    max-width:1500px;
    margin:0 auto 50px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:38px;
}


/* TARJETAS */

.sala{
    display:block;

    background:#101010;

    border:1px solid #9b7a3c;

    text-decoration:none;

    color:#f2eee7;

    overflow:hidden;

    box-shadow:
        0 0 18px rgba(0,0,0,.45);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.sala:hover{
    transform:translateY(-4px);

    box-shadow:
        0 8px 28px rgba(0,0,0,.65);

    border-color:#c9a35b;
}


/* IMÁGENES */

.sala img{
    display:block;

    width:100%;
    height:430px;

    object-fit:cover;
}


/* TÍTULO DE CADA SALA */

.sala h2{
    margin:0;

    padding:20px 15px 23px;

    text-align:center;

    color:#c9a35b;

    font-size:23px;

    letter-spacing:3px;

    font-weight:normal;
}


/* ÚLTIMA TARJETA CENTRADA */

.sala.ultima{
    grid-column:1 / -1;
    width:50%;
    margin:0 auto;
}


/* BOTÓN VOLVER */

.volver{
    display:block;

    width:max-content;

    margin:0 auto 35px;

    color:#c9a35b;

    text-decoration:none;

    font-size:16px;

    letter-spacing:2px;

    transition:color .3s ease;
}

.volver:hover{
    color:#e8dcc5;
}


/* MÚSICA */

.musica{
    position:fixed;

    right:25px;
    bottom:25px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:#111;

    color:#c9a35b;

    font-size:22px;

    cursor:pointer;

    z-index:9999;

    box-shadow:0 0 12px rgba(201,163,91,.25);
}

.musica:hover{
    background:#c9a35b;
    color:#080808;
}


/* YOUTUBE OCULTO */

.youtube{
    position:fixed;

    width:1px;
    height:1px;

    opacity:0;

    pointer-events:none;

    left:-10px;
    top:-10px;
}


/* PIE */

footer{
    text-align:center;

    padding:10px 20px 30px;

    color:#8f8a82;

    font-size:14px;

    letter-spacing:1px;
}


/* MÓVIL */

@media(max-width:800px){

    header{
        padding:32px 15px 25px;
    }

    header h1{
        font-size:30px;
        letter-spacing:4px;
    }

    header p{
        font-size:15px;
    }

    .salas{
        grid-template-columns:1fr;
        gap:25px;
        width:92%;
    }

    .sala img{
        height:350px;
    }

    .sala h2{
        font-size:20px;
    }

    .sala.ultima{
        grid-column:auto;
        width:100%;
    }

    .musica{
        right:15px;
        bottom:15px;
    }

}

</style>

</head>

    allow="autoplay">
</iframe>


<script>

const boton = document.getElementById("botonMusica");

const youtube = document.getElementById("youtube");

let sonando = false;

boton.addEventListener("click", function(){

    if(!sonando){

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        boton.textContent = "Ⅱ";

        sonando = true;

    }else{

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        boton.textContent = "♪";

        sonando = false;

    }

});

</script>
