

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semana Santa de Jerez</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, "Times New Roman", serif;
}

/* PORTADA */

.portada {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* IMÁGENES */

.slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 2s ease-in-out;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.slide.activa {
    opacity: 1;
}

/* CAPA OSCURA MUY SUAVE */

.portada::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.22);
    pointer-events: none;
}

/* CONTENIDO */

.contenido {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
    color: white;
}

/* TITULO */

h1 {
    margin: 0;
    font-size: clamp(38px, 6vw, 76px);
    letter-spacing: 8px;
    font-weight: normal;
    text-shadow: 0 3px 15px #000;
}

/* SUBTITULO */

.subtitulo {
    margin-top: 18px;
    font-size: clamp(18px, 2vw, 28px);
    letter-spacing: 4px;
    color: #c9a35b;
    text-shadow: 0 2px 8px #000;
}

/* MENU */

.menu {
    margin-top: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
}

.menu a {
    color: #ffffff;
    text-decoration: none;
    font-size: 17px;
    letter-spacing: 2px;
    transition: color 0.3s ease;
    text-shadow: 0 2px 8px #000;
}

.menu a:hover {
    color: #c9a35b;
}

/* BOTON MUSICA */

#musicaBtn {
    position: fixed;
    z-index: 20;
    bottom: 25px;
    right: 25px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid #c9a35b;
    background: rgba(0,0,0,0.65);
    color: #c9a35b;
    font-size: 21px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}

#musicaBtn:hover {
    background: rgba(201,163,91,0.18);
    transform: scale(1.05);
}

/* YOUTUBE OCULTO */

#youtube {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    left: -100px;
    top: -100px;
}
