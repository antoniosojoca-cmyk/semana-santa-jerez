* {

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080706;
    font-family: Georgia, "Times New Roman", serif;

/* =========================
   PORTADA
========================= */

.portada {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}


/* =========================
   IMÁGENES
========================= */

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;

    opacity: 0;

    transition: opacity 2.5s ease-in-out;
}

.slide.activa {
    opacity: 1;
}


/* =========================
   OSCURECIDO
========================= */

.portada::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.12),
            rgba(0,0,0,0.18) 45%,
            rgba(0,0,0,0.78)
        );

    pointer-events: none;
}


/* =========================
   TITULO
========================= */

.titulo {
    position: absolute;

    z-index: 5;

    left: 0;
    right: 0;

    bottom: 115px;

    text-align: center;

    color: #f1eadb;

    padding: 20px;

    text-shadow:
        0 3px 12px rgba(0,0,0,0.9);
}

.titulo h1 {

    margin: 0;

    font-size: clamp(38px, 6vw, 82px);

    font-weight: normal;

    letter-spacing: 5px;
}

.titulo p {

    font-size: clamp(16px, 2vw, 24px);

}


/* =========================
   LINEA DECORATIVA
========================= */

.linea {

    position: absolute;

    z-index: 6;

    bottom: 91px;

    left: 50%;

    transform: translateX(-50%);

    width: 90px;

    height: 1px;

    background: #b9a06a;
}


/* =========================
   MENU PRINCIPAL
========================= */

.menu {

    position: absolute;

    z-index: 10;

    left: 0;
    right: 0;

    bottom: 35px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 38px;

    flex-wrap: wrap;

    padding: 0 20px;
}


/* =========================
   ELEMENTOS DEL MENU
========================= */

.menu-item {

    position: relative;
}

.menu-item > a {

    color: #eee7d8;

    text-decoration: none;

    font-size: 15px;

    letter-spacing: 2px;

    transition: color 0.3s ease;

    display: block;

    padding: 8px 0;
}

.menu-item > a:hover {

    color: #b9a06a;
}


/* =========================
   SUBMENU MADRUGÁ
========================= */

.submenu {

    position: absolute;

    left: 50%;

    bottom: 100%;

    transform: translateX(-50%);

    min-width: 190px;

    background: rgba(8,7,6,0.97);

    border: 1px solid #9b7a3c;

    padding: 8px 0;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.6);
}


/* Flecha decorativa */

.submenu::after {

    content: "";

    position: absolute;

    bottom: -6px;

    left: 50%;

    transform: translateX(-50%) rotate(45deg);

    width: 10px;

    height: 10px;

    background: #080706;

    border-right: 1px solid #9b7a3c;

    border-bottom: 1px solid #9b7a3c;
}


/* Mostrar submenu */

.menu-item:hover .submenu {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* Enlaces del submenu */

.submenu a {

    display: block;

    padding: 10px 18px;

    color: #eee7d8;

    text-decoration: none;

    font-size: 14px;

    letter-spacing: 1.5px;

    white-space: nowrap;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

.submenu a:hover {

    background: rgba(185,160,106,0.12);

    color: #b9a06a;
}


/* =========================
   BOTON MUSICA
========================= */

.musica {

    position: fixed;

    z-index: 20;

    right: 22px;

    bottom: 22px;

    width: 42px;

    height: 42px;

    border-radius: 50%;

    border: 1px solid #b9a06a;

    background: rgba(8,7,6,0.75);

    color: #b9a06a;

    font-size: 19px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition: all 0.3s ease;
}

.musica:hover {

    background: rgba(185,160,106,0.18);

    transform: scale(1.08);
}

}

<script>


/* =========================
   CAMBIO DE IMAGENES
========================= */

const slides = document.querySelectorAll(".slide");

let actual = 0;

setInterval(() => {

    slides[actual].classList.remove("activa");

    actual = (actual + 1) % slides.length;

    slides[actual].classList.add("activa");

}, 7000);



/* =========================
   MUSICA
========================= */

let sonando = false;


function alternarMusica() {

    const iframe =
        document.getElementById("youtube");

    if (!sonando) {

        iframe.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        sonando = true;

    } else {

        iframe.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        sonando = false;

    }

}


/* =========================
   INTENTO DE AUTOPLAY
========================= */

window.addEventListener("load", function() {

    setTimeout(function() {

        const iframe =
            document.getElementById("youtube");

        iframe.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        sonando = true;

    }, 1500);

});

</script>
