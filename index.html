
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semana Santa de Jerez</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, "Times New Roman", serif;
}

.portada {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* IMÁGENES DE LA PORTADA */

.slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 2s ease-in-out;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.slide.activa {
    opacity: 1;
}

/* CAPA OSCURA */

.portada::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.22);
    pointer-events: none;
}

/* CONTENIDO CENTRAL */

.contenido {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
    color: white;
}

/* TITULO */

h1 {
    margin: 0;
    font-size: clamp(38px, 6vw, 76px);
    letter-spacing: 8px;
    font-weight: normal;
    text-shadow: 0 3px 15px #000;
}

/* SUBTITULO */

.subtitulo {
    margin-top: 18px;
    font-size: clamp(18px, 2vw, 28px);
    letter-spacing: 4px;
    color: #c9a35b;
    text-shadow: 0 2px 8px #000;
}

/* MENU PRINCIPAL */

.menu {
    margin-top: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
}

.menu a {
    color: #ffffff;
    text-decoration: none;
    font-size: 17px;
    letter-spacing: 2px;
    transition: color 0.3s ease;
    text-shadow: 0 2px 8px #000;
}

.menu a:hover {
    color: #c9a35b;
}

/* BOTON DE MUSICA */

#musicaBtn {
    position: fixed;
    z-index: 20;
    bottom: 25px;
    right: 25px;

    width: 46px;
    height: 46px;

    border-radius: 50%;
    border: 1px solid #c9a35b;

    background: rgba(0,0,0,0.65);

    color: #c9a35b;

    font-size: 21px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: 0.3s;
}

#musicaBtn:hover {
    background: rgba(201,163,91,0.18);
    transform: scale(1.05);
}

/* YOUTUBE OCULTO */

#youtube {
    position: fixed;
    width: 1px;
    height: 1px;

    opacity: 0;

    pointer-events: none;

    left: -100px;
    top: -100px;
}

/* MOVIL */

@media (max-width: 700px) {

    h1 {
        letter-spacing: 4px;
    }

    .subtitulo {
        letter-spacing: 2px;
    }

    .menu {
        gap: 18px;
        margin-top: 30px;
    }

    .menu a {
        font-size: 14px;
    }

}

</style>

</head>

<body>

<div class="portada">

    <!-- PRIMERA IMAGEN -->

    <div class="slide activa">

        <img src="https://s1.abcstatics.com/abc/www/multimedia/sevilla/2024/06/06/lanzada-de-jerez-U65824505088nZV-1200x630%40diario_abc.jpg">

    </div>


    <!-- SEGUNDA IMAGEN -->

    <div class="slide">

        <img src="https://static.grupojoly.com/clip/5d24e317-06f7-4d5a-b0ad-1845cccd8844_source-aspect-ratio_1600w_0.jpg">

    </div>


    <!-- TERCERA IMAGEN -->

    <div class="slide">

        <img src="https://www.uniondehermandades.com/wp-content/uploads/2018/11/1-1.jpg">

    </div>


    <!-- TITULO Y MENU -->

    <div class="contenido">

        <h1>SEMANA SANTA DE JEREZ</h1>

        <div class="subtitulo">
            Fe · tradición · silencio · emoción
        </div>


        <nav class="menu">

            <a href="hermandades.html">
                HERMANDADES
            </a>

            <a href="madruga.html">
                MADRUGÁ
            </a>

            <a href="#">
                SEMANA SANTA
            </a>

            <a href="#">
                DEVOCIONES
            </a>

            <a href="#">
                GALERÍA
            </a>

        </nav>

    </div>

</div>


<!-- MUSICA DE FONDO -->

<iframe
    id="youtube"
    src="https://www.youtube.com/embed/oYNb9el5wCg?autoplay=1&loop=1&playlist=oYNb9el5wCg&enablejsapi=1"
    allow="autoplay">
</iframe>


<!-- BOTON DISCRETO -->

<button id="musicaBtn" title="Música">
    ♪
</button>


<script>

/* CAMBIO AUTOMATICO DE LAS IMAGENES */

const slides = document.querySelectorAll(".slide");

let actual = 0;

setInterval(function() {

    slides[actual].classList.remove("activa");

    actual = (actual + 1) % slides.length;

    slides[actual].classList.add("activa");

}, 7000);


/* CONTROL DE LA MUSICA */

const boton = document.getElementById("musicaBtn");

const youtube = document.getElementById("youtube");

let reproduciendo = true;


boton.addEventListener("click", function() {

    if (reproduciendo) {

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        reproduciendo = false;

    } else {

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        reproduciendo = true;

    }

});

</script>

</body>

</html>
