
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rostros — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#080808;
    color:#f2eee7;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    min-height:100vh;
}


/* CABECERA */

header{
    text-align:center;
    padding:45px 20px 30px;
}

header h1{
    margin:0;

    font-size:42px;

    letter-spacing:5px;

    font-weight:normal;
}

header p{
    margin:14px 0 0;

    color:#c9a35b;

    font-size:18px;

    letter-spacing:2px;
}


/* SALAS */

.salas{
    width:94%;
    max-width:1500px;

    margin:0 auto 50px;

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:38px;
}


/* TARJETAS */

.sala{
    display:block;

    background:#101010;

    border:1px solid #9b7a3c;

    color:#f2eee7;

    text-decoration:none;

    overflow:hidden;

    box-shadow:
        0 0 18px rgba(0,0,0,.45);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.sala:hover{
    transform:translateY(-4px);

    box-shadow:
        0 8px 28px rgba(0,0,0,.65);

    border-color:#c9a35b;
}


/* IMÁGENES */

.sala img{
    display:block;

    width:100%;

    height:520px;

    object-fit:cover;
}


/* TÍTULOS */

.sala h2{
    margin:0;

    padding:22px 15px 25px;

    text-align:center;

    color:#c9a35b;

    font-size:25px;

    letter-spacing:4px;

    font-weight:normal;
}


/* VOLVER */

.volver{
    display:block;

    width:max-content;

    margin:0 auto 35px;

    color:#c9a35b;

    text-decoration:none;

    font-size:16px;

    letter-spacing:2px;

    transition:color .3s ease;
}

.volver:hover{
    color:#e8dcc5;
}


/* PIE */

footer{
    text-align:center;

    padding:10px 20px 30px;

    color:#8f8a82;

    font-size:14px;

    letter-spacing:1px;
}


/* MÓVIL */

@media(max-width:800px){

    header{
        padding:32px 15px 25px;
    }

    header h1{
        font-size:30px;
        letter-spacing:4px;
    }

    header p{
        font-size:15px;
    }

    .salas{
        grid-template-columns:1fr;

        gap:25px;

        width:92%;
    }

    .sala img{
        height:380px;
    }

    .sala h2{
        font-size:21px;
    }

}

</style>

</head>


<body>


<header>

    <h1>ROSTROS</h1>

    <p>
        Miradas que hablan de fe, dolor, esperanza y devoción
    </p>

</header>


<main class="salas">


    <!-- CRISTOS -->

    <a href="cristos.html" class="sala">

        <img
            src="https://www.inmartistaplastica.com/wp-content/uploads/2022/10/inmaculada-pena-ruiz-retrato-santisimo-cristo-de-las-almas-2022-01.jpg"
            alt="Cristos">

        <h2>
            CRISTOS
        </h2>

    </a>


    <!-- VÍRGENES -->

    <a href="virgenes.html" class="sala">

        <img
            src="https://www.elmira.es/asset/thumbnail,992,558,center,center/media/elmira/images/2017/02/03/Virgen-del-valle-de-Jerez-Jorge-Cabeza.jpg"
            alt="Vírgenes">

        <h2>
            VÍRGENES
        </h2>

    </a>


</main>


<a href="index.html" class="volver">
    ← PORTADA
</a>


<footer>

    Semana Santa de Jerez · Rostros · 2026

</footer>


</body>

</html>
