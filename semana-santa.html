```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Semana Santa — Andalucía</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#080808;
    color:#ffffff;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    padding:35px 25px 50px;
}

.contenedor{
    width:100%;
    max-width:1500px;
    margin:auto;
}

.titulo{
    text-align:center;
    color:#e8dcc5;
    font-size:34px;
    letter-spacing:7px;
    margin:10px 0 8px;
    text-shadow:0 2px 8px #000;
}

.subtitulo{
    text-align:center;
    color:#9b7a3c;
    font-size:16px;
    letter-spacing:4px;
    margin-bottom:35px;
}

.salas{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.sala{
    position:relative;
    height:250px;
    border:1px solid #9b7a3c;
    background:#111;
    overflow:hidden;
    text-decoration:none;
    box-shadow:0 0 20px rgba(0,0,0,.7);
    transition:transform .3s ease, border-color .3s ease;
}

.sala:hover{
    transform:scale(1.015);
    border-color:#c9a35b;
}

.sala img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:.72;
    transition:opacity .3s ease, transform .4s ease;
}

.sala:hover img{
    opacity:.9;
    transform:scale(1.03);
}

.nombre{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:22px 10px;
    text-align:center;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.95),
        rgba(0,0,0,.45),
        transparent
    );
    color:#e8dcc5;
    font-size:25px;
    letter-spacing:5px;
    text-shadow:0 2px 8px #000;
}

.volver{
    display:block;
    width:max-content;
    margin:35px auto 0;
    color:#c9a35b;
    text-decoration:none;
    font-size:16px;
    letter-spacing:2px;
    transition:color .3s ease;
}

.volver:hover{
    color:#ffffff;
}

.musica{
    position:fixed;
    right:25px;
    bottom:25px;
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid #c9a35b;
    background:#111;
    color:#c9a35b;
    font-size:23px;
    cursor:pointer;
    z-index:9999;
    box-shadow:0 0 12px rgba(201,163,91,.25);
}

.youtube{
    position:fixed;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
    left:-10px;
    top:-10px;
}

@media(max-width:700px){

    .salas{
        grid-template-columns:1fr;
    }

    .titulo{
        font-size:27px;
        letter-spacing:5px;
    }

    .sala{
        height:220px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

    <div class="titulo">
        SEMANA SANTA
    </div>

    <div class="subtitulo">
        SEIS CIUDADES · SEIS MIRADAS
    </div>

    <div class="salas">

        <a href="sevilla.html" class="sala">

                SEVILLA

        </a>


        <a href="malaga.html" class="sala">

            <img
            src="https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=1600&q=80"
            alt="Málaga">

            <div class="nombre">
                MÁLAGA
            </div>

        </a>


        <a href="granada.html" class="sala">

            <img
            src="https://images.unsplash.com/photo-1509840841025-9088ba78a826?auto=format&fit=crop&w=1600&q=80"
            alt="Granada">

            <div class="nombre">
                GRANADA
            </div>

        </a>


        <a href="jaen.html" class="sala">

            <img
            src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1600&q=80"
            alt="Jaén">

            <div class="nombre">
                JAÉN
            </div>

        </a>


        <a href="cadiz.html" class="sala">

            <img
            src="https://images.unsplash.com/photo-1559564484-e48c7f09e6b2?auto=format&fit=crop&w=1600&q=80"
            alt="Cádiz">

            <div class="nombre">
                CÁDIZ
            </div>

        </a>


        <a href="cordoba.html" class="sala">

            <img
            src="https://images.unsplash.com/photo-1559386484-97dfc0e15539?auto=format&fit=crop&w=1600&q=80"

            <div class="nombre">
                CÓRDOBA
            </div>

        </a>

    </div>

    <a href="index.html" class="volver">
        ← MENÚ PRINCIPAL
    </a>

</div>


<button class="musica" id="botonMusica">
    ♪
</button>


<iframe
    id="youtube"
    class="youtube"
    src="https://www.youtube.com/embed/M71Jq0DeoP4?enablejsapi=1&playsinline=1&controls=0&loop=1&playlist=M71Jq0DeoP4"
    allow="autoplay">
</iframe>


<script>

const boton = document.getElementById("botonMusica");
const youtube = document.getElementById("youtube");

let sonando = false;

boton.addEventListener("click",function(){

    if(!sonando){

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        boton.textContent="Ⅱ";
        sonando=true;

    }else{

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        boton.textContent="♪";
        sonando=false;

    }

});

</script>

</body>

</html>
