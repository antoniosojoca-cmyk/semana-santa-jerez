
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buena Muerte — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    color:#f1eadc;
}

.exposicion{
    position:relative;
    width:100%;
    height:100vh;
    background:#000;
}


/* =========================
   FOTOGRAFIAS
   ========================= */

.slide{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;

    transition:opacity 2.5s ease-in-out;

    background:#000;

    pointer-events:none;
}

.slide.activa{
    opacity:1;
}


/*
   LA IMAGEN OCUPA LA PANTALLA,
   SIN MARCO, SIN BORDE Y SIN SOMBRA
*/

.imagen{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    padding:40px 50px 65px;
}

.imagen img{

    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    display:block;

    border:0;
    outline:0;

    /*
       INTENTO DE FUNDIR LOS TONOS OSCUROS
       CON EL FONDO NEGRO
    */

    mix-blend-mode:screen;

    filter:
        brightness(.72)
        contrast(2.15)
        saturate(1.05);

    transform:scale(1);

    transition:
        transform 8s ease,
        filter 2.5s ease;
}


.slide.activa .imagen img{

    transform:scale(1.025);

    filter:
        brightness(.82)
        contrast(2.25)
        saturate(1.08);
}


/* =========================
   OSCURECIMIENTO
   ========================= */

.velo{
    position:absolute;
    inset:0;

    z-index:5;

    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.25),
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.35)
        );
}


/* =========================
   TITULO
   ========================= */

.titulo{
    position:absolute;

    top:25px;
    left:0;
    right:0;

    z-index:20;

    text-align:center;

    pointer-events:none;
}

.titulo h1{
    margin:0;

    font-size:29px;
    font-weight:normal;

    letter-spacing:7px;

    color:#e8dcc5;

    text-shadow:
        0 2px 14px #000;
}

.titulo p{
    margin:8px 0 0;

    font-size:12px;

    letter-spacing:3px;

    color:#c9a35b;

    text-shadow:
        0 2px 12px #000;
}


/* =========================
   TEXTO INFERIOR
   ========================= */

.texto{
    position:absolute;

    left:0;
    right:0;
    bottom:28px;

    z-index:20;

    text-align:center;

    pointer-events:none;
}

.texto h2{
    margin:0;

    font-size:22px;
    font-weight:normal;

    letter-spacing:3px;

    color:#f1eadc;

    text-shadow:
        0 2px 14px #000;
}

.texto p{
    margin:7px 0 0;

    font-size:12px;

    letter-spacing:2px;

    color:#c9a35b;

    text-shadow:
        0 2px 10px #000;
}


/* =========================
   BOTON MUSICA
   ========================= */

.musica{
    position:fixed;

    right:24px;
    bottom:22px;

    z-index:50;

    width:46px;
    height:46px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:#050505;

    color:#c9a35b;

    font-size:21px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.musica:hover{
    background:#c9a35b;
    color:#000;
}


/* =========================
   VOLVER
   ========================= */

.volver{
    position:fixed;

    left:24px;
    bottom:25px;

    z-index:50;

    color:#e8dcc5;

    text-decoration:none;

    font-size:11px;

    letter-spacing:2px;

    opacity:.8;
}

.volver:hover{
    color:#c9a35b;
}


/* =========================
   YOUTUBE OCULTO
   ========================= */

.youtube{
    position:fixed;

    left:-10000px;
    top:-10000px;

    width:1px;
    height:1px;

    opacity:0;
    pointer-events:none;
}


/* =========================
   MOVIL
   ========================= */

@media(max-width:700px){

    .imagen{
        padding:50px 12px 70px;
    }

    .titulo{
        top:20px;
    }

    .titulo h1{
        font-size:21px;
        letter-spacing:5px;
    }

    .titulo p{
        font-size:9px;
        letter-spacing:2px;
    }

    .texto{
        bottom:27px;
        padding:0 45px;
    }

    .texto h2{
        font-size:17px;
        letter-spacing:2px;
    }

    .texto p{
        font-size:10px;
    }

    .musica{
        width:42px;
        height:42px;
        right:15px;
        bottom:15px;
    }

    .volver{
        left:15px;
        bottom:21px;
        font-size:9px;
    }

}

</style>

</head>


<body>


<div class="exposicion">


    <!-- =========================
         CRISTO 1
         ========================= -->

    <div class="slide activa">

        <div class="imagen">

            <img
            src="https://static.grupojoly.com/clip/8363eb48-49ce-4dd4-af30-c30e1aa88f0f_source-aspect-ratio_1600w_0.jpg"
            alt="Santísimo Cristo de la Buena Muerte">

        </div>

    </div>


    <!-- =========================
         CRISTO 2
         ========================= -->

    <div class="slide">

        <div class="imagen">

            <img
            src="https://soyjerez.com/wp-content/uploads/2020/06/cristo-buena-muerte.jpg"
            alt="Santísimo Cristo de la Buena Muerte">

        </div>

    </div>


    <!-- =========================
         VIRGEN 1
         ========================= -->

    <div class="slide">

        <div class="imagen">

            <img
            src="https://static.grupojoly.com/clip/fd2006e4-8309-46aa-987e-1ab8e476cb35_source-aspect-ratio_1600w_0.jpg"
            alt="María Santísima del Dulce Nombre">

        </div>

    </div>


    <!-- =========================
         VIRGEN 2
         ========================= -->

    <div class="slide">

        <div class="imagen">

            <img
            src="https://www.jerez.es/fileadmin/DesarrolloWeb/ESPECIALES/MAGNA_MARIANA_JEREZ_2024/IMG_Imagineria/MariaDulceNombre.jpg"
            alt="María Santísima del Dulce Nombre">

        </div>

    </div>


    <!-- =========================
         CRISTO 3
         ========================= -->

    <div class="slide">

        <div class="imagen">

            <img
            src="https://2.bp.blogspot.com/_TMGpNzqt1fQ/TNQSiAdbo1I/AAAAAAAAKX8/I-w2FBo-8Uw/s1600/Buena%2BMuerte%2B%287%29.JPG"
            alt="Santísimo Cristo de la Buena Muerte">

        </div>

    </div>


    <!-- =========================
         VIRGEN 3
         ========================= -->

    <div class="slide">

        <div class="imagen">

            <img
            src="https://www.uniondehermandades.com/wp-content/uploads/2018/12/5-10.jpg"
            alt="María Santísima del Dulce Nombre">

        </div>

    </div>


    <div class="velo"></div>


    <!-- TITULO -->

    <div class="titulo">

        <h1>BUENA MUERTE</h1>

        <p>JEREZ DE LA FRONTERA · MADRUGADA</p>

    </div>


    <!-- TEXTO -->

    <div class="texto" id="texto">

        <h2>Santísimo Cristo de la Buena Muerte</h2>

        <p>El silencio de la noche</p>

    </div>


</div>


<!-- =========================
     BOTON MUSICA
     ========================= -->

<button
class="musica"
id="botonMusica"
type="button">

♪

</button>


<!-- VOLVER -->

<a
class="volver"
href="hermandades.html">

← HERMANDADES

</a>


<!-- =========================
     YOUTUBE
     ========================= -->

<iframe
class="youtube"
id="youtube"
src="https://www.youtube.com/embed/Uq0QTbotmag?enablejsapi=1&playsinline=1&loop=1&playlist=Uq0QTbotmag"
allow="autoplay">
</iframe>


<script>

/* =========================
   DIAPOSITIVAS
   ========================= */

const slides =
document.querySelectorAll(".slide");

const texto =
document.getElementById("texto");

const textos = [

    [
        "Santísimo Cristo de la Buena Muerte",
        "El silencio de la noche"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "Ante la Cruz"
    ],

    [
        "María Santísima del Dulce Nombre",
        "La mirada de María"
    ],

    [
        "María Santísima del Dulce Nombre",
        "Madre del Dulce Nombre"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "La Pasión y el silencio"
    ],

    [
        "María Santísima del Dulce Nombre",
        "La luz de la Madrugada"
    ]

];

let actual = 0;


function cambiarSlide(){

    slides[actual].classList.remove("activa");

    actual++;

    if(actual >= slides.length){
        actual = 0;
    }

    slides[actual].classList.add("activa");

    texto.querySelector("h2").textContent =
        textos[actual][0];

    texto.querySelector("p").textContent =
        textos[actual][1];

}


setInterval(cambiarSlide,7000);


/* =========================
   MUSICA
   ========================= */

const youtube =
document.getElementById("youtube");

const botonMusica =
document.getElementById("botonMusica");

let musicaActiva = false;


/*
   Cuando pulsamos el botón,
   esperamos un instante y
   mandamos la orden a YouTube.
*/

function reproducirMusica(){

    youtube.contentWindow.postMessage(
        JSON.stringify({
            event:"command",
            func:"playVideo",
            args:[]
        }),
        "*"
    );

    musicaActiva = true;

    botonMusica.textContent="♫";
}


function pararMusica(){

    youtube.contentWindow.postMessage(
        JSON.stringify({
            event:"command",
            func:"pauseVideo",
            args:[]
        }),
        "*"
    );

    musicaActiva = false;

    botonMusica.textContent="♪";
}


botonMusica.addEventListener(
    "click",
    function(){

        if(musicaActiva){

            pararMusica();

        }else{

            reproducirMusica();

        }

    }
);


/*
   Intentamos autoplay.
   Si Chrome lo bloquea,
   el botón permite iniciarla.
*/

setTimeout(
    reproducirMusica,
    2500
);

</script>


</body>
