
<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<title>Buena Muerte — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#f1eadc;
    font-family:Georgia,"Times New Roman",serif;
    overflow:hidden;
}

body{
    background:#000;
}


/* =========================
   ESCENARIO
   ========================= */

.exposicion{
    position:relative;

    width:100%;
    height:100vh;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   FOTOGRAFIAS
   ========================= */

.slide{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;

    transition:opacity 2.5s ease-in-out;

    background:#000;

    pointer-events:none;
}

.slide.activa{
    opacity:1;
}


/* =========================
   MARCO ANCHO
   ========================= */

.marco{

    position:relative;

    width:92vw;
    max-width:1500px;

    height:74vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    overflow:hidden;
}


/* =========================
   IMAGEN HORIZONTAL
   ========================= */

.marco img{

    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center;

    border:0;
    outline:0;

    box-shadow:none;

    transform:scale(1);

    filter:brightness(.94);

    transition:
        transform 8s ease,
        filter 2s ease;
}


.slide.activa .marco img{

    transform:scale(1.025);

    filter:brightness(1);
}


/* =========================
   VELO SUAVE
   ========================= */

.velo{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;

    background:

        linear-gradient(
            to bottom,
            rgba(0,0,0,.15),
            transparent 25%,
            transparent 70%,
            rgba(0,0,0,.30)
        );
}


/* =========================
   TITULO
   ========================= */

.titulo{

    position:absolute;

    top:24px;

    left:0;
    right:0;

    z-index:20;

    text-align:center;

    pointer-events:none;
}

.titulo h1{

    margin:0;

    color:#e8dcc5;

    font-size:29px;

    font-weight:normal;

    letter-spacing:7px;

    text-shadow:
        0 2px 15px #000;
}

.titulo p{

    margin:8px 0 0;

    color:#c9a35b;

    font-size:12px;

    letter-spacing:3px;

    text-shadow:
        0 2px 12px #000;
}


/* =========================
   TEXTO
   ========================= */

.texto{

    position:absolute;

    left:0;
    right:0;

    bottom:27px;

    z-index:20;

    text-align:center;

    pointer-events:none;
}

.texto h2{

    margin:0;

    color:#f1eadc;

    font-size:21px;

    font-weight:normal;

    letter-spacing:3px;

    text-shadow:
        0 2px 14px #000;
}

.texto p{

    margin:7px 0 0;

    color:#c9a35b;

    font-size:12px;

    letter-spacing:2px;

    text-shadow:
        0 2px 10px #000;
}


/* =========================
   BOTON MUSICA
   ========================= */

.musica{

    position:fixed;

    right:24px;
    bottom:22px;

    z-index:50;

    width:46px;
    height:46px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:#050505;

    color:#c9a35b;

    font-size:21px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        background .3s ease,
        color .3s ease;
}

.musica:hover{

    background:#c9a35b;

    color:#000;
}


/* =========================
   VOLVER
   ========================= */

.volver{

    position:fixed;

    left:24px;
    bottom:25px;

    z-index:50;

    color:#e8dcc5;

    text-decoration:none;

    font-size:11px;

    letter-spacing:2px;

    opacity:.8;

    transition:
        color .3s ease,
        opacity .3s ease;
}

.volver:hover{

    color:#c9a35b;

    opacity:1;
}


/* =========================
   YOUTUBE OCULTO
   ========================= */

.youtube{

    position:fixed;

    left:-10000px;
    top:-10000px;

    width:1px;
    height:1px;

    opacity:0;

    pointer-events:none;
}


/* =========================
   MOVIL
   ========================= */

@media(max-width:700px){

    .marco{

        width:96vw;

        height:68vh;
    }

    .titulo{

        top:20px;
    }

    .titulo h1{

        font-size:21px;

        letter-spacing:5px;
    }

    .titulo p{

        font-size:9px;

        letter-spacing:2px;
    }

    .texto{

        bottom:28px;

        padding:0 40px;
    }

    .texto h2{

        font-size:17px;

        letter-spacing:2px;
    }

    .texto p{

        font-size:10px;
    }

    .musica{

        width:42px;
        height:42px;

        right:15px;
        bottom:15px;
    }

    .volver{

        left:15px;
        bottom:21px;

        font-size:9px;
    }

}

</style>

<script>

/* =========================
   DIAPOSITIVAS
   ========================= */

const slides =
document.querySelectorAll(".slide");

const tituloFoto =
document.querySelector(".texto h2");

const subtituloFoto =
document.querySelector(".texto p");


const textos = [

    [
        "María Santísima del Dulce Nombre",
        "La noche de la Buena Muerte"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "El silencio de la Madrugada"
    ],

    [
        "María Santísima del Dulce Nombre",
        "Madre del Dulce Nombre"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "Ante la Catedral"
    ],

    [
        "La Buena Muerte",
        "Jerez · Viernes Santo Madrugada"
    ],

    [
        "La Buena Muerte",
        "Silencio, fe y tradición"
    ]

];


let actual = 0;


function cambiarSlide(){

    slides[actual].classList.remove("activa");

    actual++;

    if(actual >= slides.length){

        actual = 0;
    }

    slides[actual].classList.add("activa");

    tituloFoto.textContent =
        textos[actual][0];

    subtituloFoto.textContent =
        textos[actual][1];
}


/* 7 segundos por fotografía */

setInterval(
    cambiarSlide,
    7000
);


/* =========================
   MUSICA
   ========================= */

const youtube =
document.getElementById("youtube");

const botonMusica =
document.getElementById("botonMusica");

let musicaActiva = false;


function reproducirMusica(){

    youtube.contentWindow.postMessage(

        JSON.stringify({

            event:"command",

            func:"playVideo",

            args:[]

        }),

        "*"
    );

    musicaActiva = true;

    botonMusica.textContent="♫";
}


function pararMusica(){

    youtube.contentWindow.postMessage(

        JSON.stringify({

            event:"command",

            func:"pauseVideo",

            args:[]

        }),

        "*"
    );

    musicaActiva = false;

    botonMusica.textContent="♪";
}


botonMusica.addEventListener(
    "click",
    function(){

        if(musicaActiva){

            pararMusica();

        }else{

            reproducirMusica();

        }

    }
);

</script>
