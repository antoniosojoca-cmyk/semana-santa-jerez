
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buena Muerte — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#050505;
    color:#f1eadc;
    font-family:Georgia,"Times New Roman",serif;
    overflow:hidden;
}

/* ESCENARIO */

.exposicion{
    position:relative;
    width:100%;
    height:100vh;
    background:#050505;
}

/* FOTOGRAFIAS */

.slide{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;

    transition:
        opacity 2.8s ease-in-out;

    pointer-events:none;
}

.slide.activa{
    opacity:1;
}

/* IMAGEN */

.slide img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    filter:brightness(.82);

    transform:scale(1.01);

    transition:
        transform 8s ease,
        filter 3s ease;
}

.slide.activa img{
    transform:scale(1.045);
    filter:brightness(.94);
}

/* OSCURECIDO SUAVE */

.slide::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.15),
            rgba(0,0,0,.05) 45%,
            rgba(0,0,0,.55)
        );

    pointer-events:none;
}

/* TITULO SUPERIOR */

.titulo{
    position:absolute;

    top:34px;
    left:0;
    right:0;

    z-index:20;

    text-align:center;

    pointer-events:none;
}

.titulo h1{
    margin:0;

    color:#e8dcc5;

    font-size:30px;
    font-weight:normal;

    letter-spacing:7px;

    text-shadow:
        0 2px 15px rgba(0,0,0,.9);
}

.titulo p{
    margin:9px 0 0;

    color:#c9a35b;

    font-size:13px;

    letter-spacing:3px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}

/* TEXTO INFERIOR */

.texto{
    position:absolute;

    left:0;
    right:0;
    bottom:48px;

    z-index:20;

    text-align:center;

    pointer-events:none;

    padding:0 25px;
}

.texto h2{
    margin:0;

    color:#f1eadc;

    font-size:25px;
    font-weight:normal;

    letter-spacing:3px;

    text-shadow:
        0 2px 14px rgba(0,0,0,1);
}

.texto p{
    margin:10px 0 0;

    color:#c9a35b;

    font-size:14px;

    letter-spacing:2px;

    text-shadow:
        0 2px 10px rgba(0,0,0,1);
}

/* BOTON MUSICA */

.musica{
    position:fixed;

    right:25px;
    bottom:24px;

    z-index:50;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:rgba(5,5,5,.75);

    color:#c9a35b;

    font-size:22px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 18px rgba(0,0,0,.7);

    transition:
        background .3s ease,
        color .3s ease;
}

.musica:hover{
    background:#c9a35b;
    color:#050505;
}

/* BOTON VOLVER */

.volver{
    position:fixed;

    left:25px;
    bottom:27px;

    z-index:50;

    color:#e8dcc5;

    text-decoration:none;

    font-size:12px;

    letter-spacing:2px;

    opacity:.75;

    transition:
        color .3s ease,
        opacity .3s ease;
}

.volver:hover{
    color:#c9a35b;
    opacity:1;
}

/* YOUTUBE OCULTO */

.youtube{
    position:fixed;

    width:1px;
    height:1px;

    left:-10000px;
    top:-10000px;

    opacity:0;
    pointer-events:none;
}

/* MOVIL */

@media(max-width:700px){

    .titulo{
        top:25px;
    }

    .titulo h1{
        font-size:22px;
        letter-spacing:5px;
    }

    .titulo p{
        font-size:11px;
        letter-spacing:2px;
    }

    .texto{
        bottom:40px;
    }

    .texto h2{
        font-size:20px;
        letter-spacing:2px;
    }

    .texto p{
        font-size:12px;
    }

    .musica{
        width:44px;
        height:44px;

        right:18px;
        bottom:18px;
    }

    .volver{
        left:18px;
        bottom:24px;
        font-size:10px;
    }

}

</style>

</head>


<body>


<div class="exposicion">


    <!-- IMAGEN 1 - CRISTO -->

    <div class="slide activa">

        <img
        src="https://static.grupojoly.com/clip/8363eb48-49ce-4dd4-af30-c30e1aa88f0f_source-aspect-ratio_1600w_0.jpg"
        alt="Santísimo Cristo de la Buena Muerte de Jerez">

    </div>


    <!-- IMAGEN 2 - CRISTO -->

    <div class="slide">

        <img
        src="https://soyjerez.com/wp-content/uploads/2020/06/cristo-buena-muerte.jpg"
        alt="Santísimo Cristo de la Buena Muerte">

    </div>


    <!-- IMAGEN 3 - VIRGEN -->

    <div class="slide">

        <img
        src="https://static.grupojoly.com/clip/fd2006e4-8309-46aa-987e-1ab8e476cb35_source-aspect-ratio_1600w_0.jpg"
        alt="María Santísima del Dulce Nombre">

    </div>


    <!-- IMAGEN 4 - VIRGEN -->

    <div class="slide">

        <img
        src="https://www.jerez.es/fileadmin/DesarrolloWeb/ESPECIALES/MAGNA_MARIANA_JEREZ_2024/IMG_Imagineria/MariaDulceNombre.jpg"
        alt="María Santísima del Dulce Nombre">

    </div>


    <!-- IMAGEN 5 - CRISTO -->

    <div class="slide">

        <img
        src="https://2.bp.blogspot.com/_TMGpNzqt1fQ/TNQSiAdbo1I/AAAAAAAAKX8/I-w2FBo-8Uw/s1600/Buena%2BMuerte%2B%287%29.JPG"
        alt="Santísimo Cristo de la Buena Muerte">

    </div>


    <!-- IMAGEN 6 - VIRGEN -->

    <div class="slide">

        <img
        src="https://www.uniondehermandades.com/wp-content/uploads/2018/12/5-10.jpg"
        alt="María Santísima del Dulce Nombre">

    </div>


    <!-- TITULO -->

    <div class="titulo">

        <h1>BUENA MUERTE</h1>

        <p>JEREZ DE LA FRONTERA · MADRUGADA</p>

    </div>


    <!-- TEXTO -->

    <div class="texto" id="texto">

        <h2>Santísimo Cristo de la Buena Muerte</h2>

        <p>El silencio de la noche</p>

    </div>


</div>


<!-- BOTON MUSICA -->

<button
class="musica"
id="botonMusica"
aria-label="Activar música">

♪
</button>


<!-- VOLVER -->

<a
class="volver"
href="hermandades.html">

← HERMANDADES

</a>


<!-- YOUTUBE OCULTO -->

<iframe
class="youtube"
id="youtube"
src="https://www.youtube.com/embed/Uq0QTbotmag?enablejsapi=1&autoplay=1&loop=1&playlist=Uq0QTbotmag"
allow="autoplay">
</iframe>


<script>

/* =========================
   CAMBIO DE FOTOGRAFIAS
   ========================= */

const slides =
document.querySelectorAll(".slide");

const texto =
document.getElementById("texto");

const textos = [

    [
        "Santísimo Cristo de la Buena Muerte",
        "El silencio de la noche"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "Ante la Cruz"
    ],

    [
        "María Santísima del Dulce Nombre",
        "La mirada de María"
    ],

    [
        "María Santísima del Dulce Nombre",
        "Madre del Dulce Nombre"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "La Pasión y el silencio"
    ],

    [
        "María Santísima del Dulce Nombre",
        "La luz de la Madrugada"
    ]

];

let actual = 0;

function cambiarSlide(){

    slides[actual].classList.remove("activa");

    actual++;

    if(actual >= slides.length){
        actual = 0;
    }

    slides[actual].classList.add("activa");

    texto.querySelector("h2").textContent =
        textos[actual][0];

    texto.querySelector("p").textContent =
        textos[actual][1];

}


/* Cada fotografía permanece unos segundos */

setInterval(cambiarSlide, 7000);


/* =========================
   MUSICA
   ========================= */

const youtube =
document.getElementById("youtube");

const botonMusica =
document.getElementById("botonMusica");

let musicaActiva = false;


/* Intentar iniciar */

setTimeout(function(){

    youtube.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        "*"
    );

    musicaActiva = true;

},1500);


/* Boton */

botonMusica.addEventListener("click",function(){

    if(musicaActiva){

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        musicaActiva = false;

        botonMusica.textContent = "♪";

    }else{

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        musicaActiva = true;

        botonMusica.textContent = "♫";

    }

});

</script>


</body>

</html>
