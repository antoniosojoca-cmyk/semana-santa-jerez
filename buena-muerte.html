
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buena Muerte — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#050505;
    color:#f1eadc;
    font-family:Georgia,"Times New Roman",serif;
    overflow:hidden;
}

/* ESCENARIO */

.exposicion{
    position:relative;
    width:100%;
    height:100vh;
    background:#050505;
}

/* CADA DIAPOSITIVA */

.slide{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;

    transition:opacity 2.8s ease-in-out;

    pointer-events:none;
}

.slide.activa{
    opacity:1;
}

/* FONDO DESENFOCADO */

.fondo{
    position:absolute;
    inset:-35px;

    background-image:var(--imagen);

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    filter:
        blur(25px)
        brightness(.38);

    transform:scale(1.12);

    opacity:.95;
}

/* OSCURECIMIENTO DEL FONDO */

.fondo::after{
    content:"";

    position:absolute;
    inset:0;

    background:rgba(0,0,0,.25);
}

/* IMAGEN PRINCIPAL */

.principal{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:45px 90px 65px;
}

.principal img{
    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    display:block;

    filter:brightness(.93);

    box-shadow:
        0 10px 45px rgba(0,0,0,.75);

    transform:scale(1.01);

    transition:
        transform 8s ease,
        filter 3s ease;
}

.slide.activa .principal img{
    transform:scale(1.035);
    filter:brightness(1);
}

/* VELO OSCURO */

.velo{
    position:absolute;
    inset:0;

    z-index:8;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            rgba(0,0,0,0) 40%,
            rgba(0,0,0,.48)
        );

    pointer-events:none;
}

/* TITULO */

.titulo{
    position:absolute;

    top:30px;
    left:0;
    right:0;

    z-index:20;

    text-align:center;

    pointer-events:none;
}

.titulo h1{
    margin:0;

    color:#e8dcc5;

    font-size:30px;
    font-weight:normal;

    letter-spacing:7px;

    text-shadow:
        0 2px 15px rgba(0,0,0,.95);
}

.titulo p{
    margin:9px 0 0;

    color:#c9a35b;

    font-size:13px;

    letter-spacing:3px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.95);
}

/* TEXTO INFERIOR */

.texto{
    position:absolute;

    left:0;
    right:0;
    bottom:42px;

    z-index:20;

    text-align:center;

    pointer-events:none;

    padding:0 25px;
}

.texto h2{
    margin:0;

    color:#f1eadc;

    font-size:25px;
    font-weight:normal;

    letter-spacing:3px;

    text-shadow:
        0 2px 14px rgba(0,0,0,1);
}

.texto p{
    margin:10px 0 0;

    color:#c9a35b;

    font-size:14px;

    letter-spacing:2px;

    text-shadow:
        0 2px 10px rgba(0,0,0,1);
}

/* BOTON MUSICA */

.musica{
    position:fixed;

    right:25px;
    bottom:24px;

    z-index:50;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:rgba(5,5,5,.78);

    color:#c9a35b;

    font-size:22px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 18px rgba(0,0,0,.7);

    transition:
        background .3s ease,
        color .3s ease;
}

.musica:hover{
    background:#c9a35b;
    color:#050505;
}

/* VOLVER */

.volver{
    position:fixed;

    left:25px;
    bottom:27px;

    z-index:50;

    color:#e8dcc5;

    text-decoration:none;

    font-size:12px;

    letter-spacing:2px;

    opacity:.78;

    transition:
        color .3s ease,
        opacity .3s ease;
}

.volver:hover{
    color:#c9a35b;
    opacity:1;
}

/* YOUTUBE OCULTO */

.youtube{
    position:fixed;

    width:1px;
    height:1px;

    left:-10000px;
    top:-10000px;

    opacity:0;
    pointer-events:none;
}

/* MOVIL */

@media(max-width:700px){

    .principal{
        padding:60px 25px 85px;
    }

    .titulo{
        top:22px;
    }

    .titulo h1{
        font-size:22px;
        letter-spacing:5px;
    }

    .titulo p{
        font-size:10px;
        letter-spacing:2px;
    }

    .texto{
        bottom:38px;
    }

    .texto h2{
        font-size:19px;
        letter-spacing:2px;
    }

    .texto p{
        font-size:11px;
    }

    .musica{
        width:44px;
        height:44px;

        right:17px;
        bottom:17px;
    }

    .volver{
        left:17px;
        bottom:23px;
        font-size:10px;
    }

}

</style>

</head>

</iframe>


<script>

/* ==========================
   FOTOGRAFIAS
   ========================== */

const slides =
document.querySelectorAll(".slide");

const texto =
document.getElementById("texto");

const textos = [

    [
        "Santísimo Cristo de la Buena Muerte",
        "El silencio de la noche"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "Ante la Cruz"
    ],

    [
        "María Santísima del Dulce Nombre",
        "La mirada de María"
    ],

    [
        "María Santísima del Dulce Nombre",
        "Madre del Dulce Nombre"
    ],

    [
        "Santísimo Cristo de la Buena Muerte",
        "La Pasión y el silencio"
    ],

    [
        "María Santísima del Dulce Nombre",
        "La luz de la Madrugada"
    ]

];

let actual = 0;


function cambiarSlide(){

    slides[actual].classList.remove("activa");

    actual++;

    if(actual >= slides.length){
        actual = 0;
    }

    slides[actual].classList.add("activa");

    texto.querySelector("h2").textContent =
        textos[actual][0];

    texto.querySelector("p").textContent =
        textos[actual][1];

}


/* 7 segundos por fotografía */

setInterval(cambiarSlide,7000);


/* ==========================
   MUSICA
   ========================== */

const youtube =
document.getElementById("youtube");

const botonMusica =
document.getElementById("botonMusica");

let musicaActiva = false;


/* Intentar iniciar automáticamente */

setTimeout(function(){

    youtube.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        "*"
    );

    musicaActiva = true;

},1500);


/* Botón manual */

botonMusica.addEventListener("click",function(){

    if(musicaActiva){

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        musicaActiva = false;

        botonMusica.textContent="♪";

    }else{

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        musicaActiva = true;

        botonMusica.textContent="♫";

    }

});

</script>
