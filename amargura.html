<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amargura — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#050505;
    overflow:hidden;
    font-family:Georgia, "Times New Roman", serif;
    color:#f2eee7;
}

/* ESCENARIO */

.escenario{
    position:relative;
    width:100%;
    height:100vh;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* FOTOGRAFÍAS */

.foto{
    position:absolute;
    width:92vw;
    max-width:1500px;
    height:74vh;
    opacity:0;
    transition:opacity 2.8s ease-in-out;
}

.foto.activa{
    opacity:1;
}

.foto img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* OSCURECIMIENTO SUAVE */

.oscuro{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.25),
            rgba(0,0,0,0.05) 45%,
            rgba(0,0,0,0.45)
        );
    pointer-events:none;
}

/* TITULO */

.titulo{
    position:absolute;
    top:6vh;
    left:0;
    width:100%;
    text-align:center;
    z-index:10;
    text-shadow:0 2px 12px rgba(0,0,0,0.9);
}

.titulo h1{
    margin:0;
    font-size:clamp(30px,4vw,58px);
    letter-spacing:7px;
    font-weight:normal;
}

.titulo p{
    margin:10px 0 0;
    font-size:clamp(12px,1.2vw,18px);
    letter-spacing:4px;
    color:#c9a35b;
}

/* TEXTO INFERIOR */

.frase{
    position:absolute;
    bottom:7vh;
    width:100%;
    text-align:center;
    z-index:10;
    font-size:clamp(13px,1.3vw,19px);
    letter-spacing:2px;
    color:#eee8df;
    text-shadow:0 2px 10px #000;
}

/* BOTÓN MÚSICA */

.musica{
    position:fixed;
    right:28px;
    bottom:28px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #c9a35b;
    background:rgba(0,0,0,0.75);
    color:#c9a35b;
    font-size:22px;
    cursor:pointer;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
}

.musica:hover{
    background:#c9a35b;
    color:#050505;
}

/* VOLVER */

.volver{
    position:fixed;
    left:28px;
    bottom:30px;
    z-index:30;
    color:#d9d1c5;
    text-decoration:none;
    font-size:14px;
    letter-spacing:2px;
    text-shadow:0 2px 8px #000;
}

.volver:hover{
    color:#c9a35b;
}

/* YOUTUBE OCULTO */

.youtube{
    position:fixed;
    width:1px;
    height:1px;
    left:-100px;
    top:-100px;
    opacity:0;
    pointer-events:none;
}

/* MÓVIL */

@media(max-width:700px){

    .foto{
        width:96vw;
        height:65vh;
    }

    .titulo{
        top:4vh;
    }

    .titulo h1{
        letter-spacing:4px;
    }

    .titulo p{
        letter-spacing:2px;
    }

    .frase{
        bottom:8vh;
        padding:0 20px;
    }

    .volver{
        left:15px;
        bottom:18px;
    }

    .musica{
        right:15px;
        bottom:15px;
    }

}

</style>
</head>


<body>

    <!-- FOTO 1 · CRISTO -->

    <!-- FOTO 3 · CRISTO -->

    <!-- FOTO 4 · VIRGEN -->

    id="youtube"
    class="youtube"
    src="https://www.youtube.com/embed/WVNiNH1-QQQ?enablejsapi=1&playsinline=1&controls=0&loop=1&playlist=WVNiNH1-QQQ"
    allow="autoplay">

<script>

/* CAMBIO DE FOTOGRAFÍAS */

const fotos = document.querySelectorAll(".foto");

let actual = 0;

setInterval(() => {

    fotos[actual].classList.remove("activa");

    actual++;

    if(actual >= fotos.length){
        actual = 0;
    }

    fotos[actual].classList.add("activa");

},7000);


/* MÚSICA */

const boton = document.getElementById("botonMusica");
const youtube = document.getElementById("youtube");

let sonando = false;

function reproducir(){

    youtube.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        "*"
    );

    sonando = true;

    boton.textContent = "Ⅱ";
}

function parar(){

    youtube.contentWindow.postMessage(
        '{"event":"command","func":"pauseVideo","args":""}',
        "*"
    );

    sonando = false;

    boton.textContent = "♪";
}

boton.addEventListener("click", function(){

    if(sonando){
        parar();
    }else{
        reproducir();
    }

});


/* INTENTO DE INICIO AUTOMÁTICO */

setTimeout(function(){

    reproducir();

},1500);

</script>
