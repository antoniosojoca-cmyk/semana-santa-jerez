<title>La Yedra — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#050505;
    color:#f2eee7;
    font-family:Georgia, "Times New Roman", serif;
    overflow:hidden;
}


/* =========================
   ESCENARIO
========================= */

.escenario{
    position:relative;
    width:100%;
    height:100vh;
    background:#050505;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================
   MARCO
========================= */

.marco{
    position:relative;

    width:92vw;
    max-width:1500px;

    height:74vh;

    overflow:hidden;

    background:#000;
}


/* =========================
   FOTOGRAFIAS
========================= */

.foto{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    opacity:0;

    transition:opacity 2.8s ease-in-out;

    z-index:1;
}

.foto.activa{
    opacity:1;
    z-index:2;
}

.foto img{
    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center center;

    display:block;
}


/* =========================
   OSCURECIMIENTO
========================= */

.oscuro{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.30),
            rgba(0,0,0,.03) 45%,
            rgba(0,0,0,.45)
        );

    pointer-events:none;

    z-index:5;
}


/* =========================
   TITULO
========================= */

.titulo{
    position:absolute;

    top:6vh;
    left:0;

    width:100%;

    text-align:center;

    z-index:10;

    text-shadow:0 2px 12px rgba(0,0,0,.9);
}

.titulo h1{
    margin:0;

    font-size:clamp(32px,4vw,58px);

    font-weight:normal;

    letter-spacing:7px;
}

.titulo p{
    margin:10px 0 0;

    color:#c9a35b;

    font-size:clamp(12px,1.2vw,18px);

    letter-spacing:4px;
}


/* =========================
   TEXTO INFERIOR
