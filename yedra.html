

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Yedra — Semana Santa de Jerez</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#050505;
    color:#f2eee7;
    font-family:Georgia, "Times New Roman", serif;
    overflow:hidden;
}


/* ESCENARIO */

.escenario{
    position:relative;

    width:100%;
    height:100vh;

    background:#050505;

    display:flex;
    align-items:center;
    justify-content:center;
}


/* MARCO */

.marco{
    position:relative;

    width:92vw;
    max-width:1500px;

    height:74vh;

    overflow:hidden;

    background:#000;
}


/* FOTOGRAFIAS */

.foto{
    position:absolute;

    top:0;
    left:0;
    right:0;
    bottom:0;

    opacity:0;

    transition:opacity 2.8s ease-in-out;

    z-index:1;
}

.foto.activa{
    opacity:1;
    z-index:2;
}

.foto img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}


/* TITULO */

.titulo{
    position:absolute;

    top:6vh;
    left:0;

    width:100%;

    text-align:center;

    z-index:10;

    pointer-events:none;

    text-shadow:0 2px 12px rgba(0,0,0,.95);
}

.titulo h1{
    margin:0;

    font-size:clamp(32px,4vw,58px);

    font-weight:normal;

    letter-spacing:7px;

    color:#ffffff;
}

.titulo p{
    margin:10px 0 0;

    color:#c9a35b;

    font-size:clamp(12px,1.2vw,18px);

    letter-spacing:4px;
}


/* TEXTO INFERIOR */

.frase{
    position:absolute;

    bottom:7vh;

    left:0;

    width:100%;

    text-align:center;

    z-index:10;

    pointer-events:none;

    font-size:clamp(13px,1.3vw,19px);

    letter-spacing:2px;

    color:#eee8df;

    text-shadow:0 2px 10px #000;
}


/* BOTON MUSICA */

.musica{
    position:fixed;

    right:28px;
    bottom:28px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid #c9a35b;

    background:rgba(0,0,0,.80);

    color:#c9a35b;

    font-size:22px;

    cursor:pointer;

    z-index:30;

    display:flex;

    align-items:center;
    justify-content:center;
}

.musica:hover{
    background:#c9a35b;
    color:#050505;
}


/* VOLVER */

.volver{
    position:fixed;

    left:28px;
    bottom:30px;

    z-index:30;

    color:#ddd;

    text-decoration:none;

    font-size:14px;

    letter-spacing:2px;

    text-shadow:0 2px 8px #000;
}

.volver:hover{
    color:#c9a35b;
}


/* YOUTUBE OCULTO */

.youtube{
    position:fixed;

    width:1px;
    height:1px;

    left:-100px;
    top:-100px;

    opacity:0;

    pointer-events:none;
}


/* MOVIL */

@media(max-width:700px){

    .marco{
        width:96vw;
        height:65vh;
    }

    .titulo{
        top:4vh;
    }

    .titulo h1{
        letter-spacing:4px;
    }

    .titulo p{
        letter-spacing:2px;
    }

    .frase{
        bottom:8vh;
        padding:0 20px;
    }

    .volver{
        left:15px;
        bottom:18px;
    }

    .musica{
        right:15px;
        bottom:15px;
    }

}

</style>

</h
