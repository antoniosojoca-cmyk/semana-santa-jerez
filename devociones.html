<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Devociones — Semana Santa de Jerez</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #f2eee7;
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
}

/* CABECERA */

header {
    padding: 45px 20px 35px;
}

header h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 5px;
    font-weight: normal;
}

header p {
    margin-top: 12px;
    color: #c9a35b;
    font-size: 19px;
    letter-spacing: 2px;
}

/* SALAS */

.salas {
    width: 94%;
    max-width: 1500px;
    margin: 10px auto 55px;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 38px;
}

.sala {
    display: block;
    position: relative;

    background: #101010;
    border: 1px solid #9b7a3c;

    text-decoration: none;
    color: #f2eee7;

    padding: 8px;

    transition: 0.35s ease;
}

.sala:hover {
    border-color: #c9a35b;
    transform: translateY(-4px);
}

.sala img {
    display: block;

    width: 100%;
    height: 430px;

    object-fit: cover;
}

.sala h2 {
    margin: 0;

    padding: 22px 10px 20px;

    font-size: 24px;
    font-weight: normal;

    letter-spacing: 3px;

    color: #c9a35b;
}

/* BOTÓN MÚSICA */

.musica {
    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid #c9a35b;

    background: #080808;
    color: #c9a35b;

    font-size: 23px;

    cursor: pointer;

    z-index: 1000;
}

.musica:hover {
    background: #c9a35b;
    color: #080808;
}

/* YOUTUBE OCULTO */

.youtube {
    position: fixed;

    width: 1px;
    height: 1px;

    left: -100px;
    top: -100px;

    border: 0;
}

/* VOLVER */

.volver {
    display: inline-block;

    margin: 0 auto 45px;

    padding: 12px 25px;

    color: #c9a35b;
    text-decoration: none;

    border: 1px solid #9b7a3c;

    font-size: 16px;
    letter-spacing: 2px;

    transition: 0.3s;
}

.volver:hover {
    background: #c9a35b;
    color: #080808;
}

/* PIE */

footer {
    padding: 25px 15px 35px;

    color: #777;

    font-size: 14px;
    letter-spacing: 1px;
}

/* MÓVIL */

@media (max-width: 800px) {

    header h1 {
        font-size: 30px;
        letter-spacing: 3px;
    }

    header p {
        font-size: 16px;
    }

    .salas {
        grid-template-columns: 1fr;
        width: 92%;
        gap: 25px;
    }

    .sala img {
        height: 350px;
    }

}

</style>

</head>

<iframe
    id="youtube"
    class="youtube"
    src="https://www.youtube.com/embed/xiu8MB24RGI?start=0&enablejsapi=1&playsinline=1&controls=0&loop=1&playlist=xiu8MB24RGI"
    allow="autoplay">
</iframe>


<script>

const boton = document.getElementById("botonMusica");
const youtube = document.getElementById("youtube");

let sonando = false;

boton.addEventListener("click", function() {

    if (!sonando) {

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"playVideo","args":""}',
            "*"
        );

        boton.textContent = "Ⅱ";

        sonando = true;

    } else {

        youtube.contentWindow.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}',
            "*"
        );

        boton.textContent = "♪";

        sonando = false;

    }

});

</script>
