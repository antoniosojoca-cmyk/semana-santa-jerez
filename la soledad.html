```html
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soledad — Semana Santa de Jerez</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: #ffffff;
    font-family: Georgia, "Times New Roman", serif;
}

/* CABECERA */

.cabecera {
    text-align: center;
    padding: 45px 20px 25px;
}

.cabecera h1 {
    margin: 0;
    color: #d0ad63;
    font-size: 48px;
    font-weight: normal;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.linea {
    width: 180px;
    height: 1px;
    background: #c9a35b;
    margin: 18px auto 12px;
}

.subtitulo {
    color: #c9a35b;
    font-size: 19px;
    letter-spacing: 2px;
}

/* GALERÍA */

.galeria {
    width: 94%;
    max-width: 1500px;
    margin: 35px auto 60px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 35px;
}

/* TARJETAS */

.foto {
    background: #0b0b0b;
    border: 1px solid #9d7d3f;
    padding: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.65);
}

.foto img {
    width: 100%;
    height: 520px;
    display: block;
    object-fit: contain;
    background: #050505;
}

/* EFECTO MUY SUAVE */

.foto:hover {
    border-color: #d0ad63;
}

.foto:hover img {
    opacity: 0.94;
}

/* PIE */

.pie {
    text-align: center;
    padding: 10px 20px 45px;
    color: #a99163;
    font-size: 15px;
    letter-spacing: 1px;
}

/* MÓVIL */

@media (max-width: 800px) {

    .cabecera {
        padding-top: 30px;
    }

    .cabecera h1 {
        font-size: 34px;
        letter-spacing: 2px;
    }

    .subtitulo {
        font-size: 16px;
    }

    .galeria {
        grid-template-columns: 1fr;
        width: 94%;
        gap: 25px;
    }

    .foto img {
        height: auto;
        max-height: none;
    }
}

</style>
</head>

<body>

<!-- CABECERA -->

<header class="cabecera">

    <h1>Soledad</h1>

    <div class="linea"></div>

    <div class="subtitulo">
        Semana Santa de Jerez de la Frontera
    </div>

</header>


<!-- GALERÍA -->

<main class="galeria">

    <!-- FOTO 1 -->

    <div class="foto">
        <img
        src="https://www.lapasionenjerez.com/wp-content/uploads/2021/09/Nuestra-Madre-y-Senora-de-la-Soledad-750x536.jpg"
        alt="Nuestra Madre y Señora de la Soledad">
    </div>


    <!-- FOTO 2 -->

    <div class="foto">
        <img
        src="https://www.jerezciudad.com/imagenes/conoce_jerez/fiestas/semana_santa/hermandades/la_soledad/misterio.jpg"
        alt="Hermandad de la Soledad de Jerez">
    </div>


    <!-- FOTO 3 -->

    <div class="foto">
        <img
        src="https://static.grupojoly.com/clip/b76a923c-0557-409f-b38c-15b96f6546f8_source-aspect-ratio_1600w_0.webp"
        alt="Soledad de Jerez">
    </div>


    <!-- FOTO 4 -->

    <div class="foto">
        <img
        src="https://static.grupojoly.com/clip/45e3cc0c-bbf1-43ce-9dd8-1c77d12e824f_source-aspect-ratio_1600w_0.webp"
        alt="Soledad — Semana Santa de Jerez">
    </div>


    <!-- FOTO 5 -->

    <div class="foto">
        <img
        src="https://static.grupojoly.com/clip/a734c404-5f06-4875-901f-af1d757c5dd8_16-9-aspect-ratio_1600w_0.webp"
        alt="Nuestra Señora de la Soledad">
    </div>


    <!-- FOTO 6 -->

    <div class="foto">
        <img
        src="https://www.lunadenisan.com/wp-content/uploads/2021/05/Soledad-1024x683.jpg"
        alt="Soledad — Jerez de la Frontera">
    </div>

</main>


<!-- PIE -->

<footer class="pie">
    Semana Santa de Jerez de la Frontera
</footer>

</body>
</html>
